appId: com.alfredkensington.gemini
productName: Gemini
copyright: >-
  MIT. This app is a wrapper around Google's Gemini web app.
  While this app is licensed under MIT, Google reserves all rights
  to their Gemini software.

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*

extraResources:
  - from: resources/webview-preload.js
    to: webview-preload.js

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  minimumSystemVersion: "13.0.0"
  category: public.app-category.productivity
  # Disable code signing — no Developer ID certificate required
  identity: null
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: "Gemini may use your camera for video features."
    NSMicrophoneUsageDescription: "Gemini may use your microphone for voice input."
    NSDownloadsFolderUsageDescription: "Gemini saves downloaded files to your Downloads folder."

dmg:
  title: Gemini
  sign: false
  writeUpdateInfo: false
